<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="300" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#1a1200"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6F0B"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" rx="4" fill="url(#cover)"/>
  <rect width="18" height="450" rx="2" fill="#040400"/>
  <!-- Gold full-bleed top band (magazine masthead) -->
  <rect x="18" y="0" width="282" height="52" fill="url(#gold)"/>
  <text x="159" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#080808" letter-spacing="2">LVN QUARTERLY</text>
  <!-- Abstract cover art — layered circles -->
  <circle cx="150" cy="220" r="130" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.2" fill="none"/>
  <circle cx="150" cy="220" r="100" stroke="#D4AF37" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
  <circle cx="150" cy="220" r="65" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <circle cx="150" cy="220" r="35" fill="#D4AF37" fill-opacity="0.1"/>
  <!-- Feather / quill icon inside circle -->
  <path d="M138 235 Q150 195 162 235 Q155 225 150 240 Q145 225 138 235Z" fill="#D4AF37" fill-opacity="0.5"/>
  <line x1="150" y1="240" x2="150" y2="260" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Issue info -->
  <rect x="18" y="340" width="282" height="110" fill="#080808"/>
  <line x1="30" y1="346" x2="270" y2="346" stroke="url(#gold)" stroke-width="1"/>
  <text x="159" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D4AF37" letter-spacing="2">ISSUE No. 13</text>
  <text x="159" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#FAF8F3">Cartographies of Voice</text>
  <text x="159" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FAF8F3" fill-opacity="0.5">AUTUMN 2025 · LITERARY VOICES NETWORK</text>
</svg>
