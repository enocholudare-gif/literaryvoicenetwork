<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="300" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1826"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6F0B"/>
    </linearGradient>
  </defs>
  <!-- Book body -->
  <rect width="300" height="450" rx="4" fill="url(#cover)"/>
  <!-- Spine shadow -->
  <rect width="18" height="450" rx="2" fill="#0a1520"/>
  <!-- Gold top/bottom border -->
  <rect x="18" y="0" width="282" height="6" fill="url(#gold)"/>
  <rect x="18" y="444" width="282" height="6" fill="url(#gold)"/>
  <!-- Decorative line art — meridian globe/map lines -->
  <circle cx="150" cy="195" r="100" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
  <ellipse cx="150" cy="195" rx="40" ry="100" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.25" fill="none"/>
  <ellipse cx="150" cy="195" rx="100" ry="38" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.25" fill="none"/>
  <line x1="50" y1="195" x2="250" y2="195" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="150" y1="95" x2="150" y2="295" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.2"/>
  <!-- Gold accent frame -->
  <rect x="30" y="16" width="258" height="360" rx="2" stroke="url(#gold)" stroke-width="1" fill="none" stroke-opacity="0.4"/>
  <!-- Title -->
  <text x="150" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FAF8F3" letter-spacing="0.5">The Glass</text>
  <text x="150" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FAF8F3" letter-spacing="0.5">Meridian</text>
  <!-- Divider -->
  <line x1="80" y1="380" x2="220" y2="380" stroke="url(#gold)" stroke-width="1"/>
  <!-- Author -->
  <text x="150" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#D4AF37" letter-spacing="1">ELEANOR VANCE</text>
  <!-- Publisher -->
  <text x="150" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FAF8F3" fill-opacity="0.4" letter-spacing="2">MERIDIAN HOUSE PRESS</text>
</svg>
