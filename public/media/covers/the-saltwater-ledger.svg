<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="300" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#0d2018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6F0B"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="200" x2="0" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a5a7a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a2a3a" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" rx="4" fill="url(#cover)"/>
  <rect width="18" height="450" rx="2" fill="#081510"/>
  <rect x="18" y="0" width="282" height="6" fill="url(#gold)"/>
  <rect x="18" y="444" width="282" height="6" fill="url(#gold)"/>
  <!-- Wave / ocean motif -->
  <path d="M30 220 Q90 190 150 220 Q210 250 270 220 L270 310 Q210 340 150 310 Q90 280 30 310 Z" fill="url(#ocean)"/>
  <path d="M30 240 Q90 210 150 240 Q210 270 270 240" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.35" fill="none"/>
  <path d="M30 260 Q90 230 150 260 Q210 290 270 260" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.25" fill="none"/>
  <!-- Ship silhouette -->
  <path d="M110 220 L115 180 L155 180 L160 220 Z" fill="#D4AF37" fill-opacity="0.2"/>
  <line x1="135" y1="220" x2="135" y2="160" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M135 160 L155 180" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
  <!-- Frame -->
  <rect x="30" y="16" width="258" height="360" rx="2" stroke="url(#gold)" stroke-width="1" fill="none" stroke-opacity="0.4"/>
  <!-- Title -->
  <text x="150" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#FAF8F3" letter-spacing="0.5">The Saltwater</text>
  <text x="150" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#FAF8F3" letter-spacing="0.5">Ledger</text>
  <line x1="80" y1="377" x2="220" y2="377" stroke="url(#gold)" stroke-width="1"/>
  <text x="150" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#D4AF37" letter-spacing="1">AMARA OSEI</text>
  <text x="150" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FAF8F3" fill-opacity="0.4" letter-spacing="2">HARBOUR &amp; LOOM</text>
</svg>
