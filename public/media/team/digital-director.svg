<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6F0B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8956C"/>
      <stop offset="100%" stop-color="#A0714A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="600" fill="url(#bg)"/>
  <rect width="480" height="600" fill="url(#glow)"/>

  <!-- Subtle grid lines (tech aesthetic) -->
  <g opacity="0.06" stroke="#D4AF37" stroke-width="0.5">
    <line x1="0" y1="100" x2="480" y2="100"/>
    <line x1="0" y1="200" x2="480" y2="200"/>
    <line x1="0" y1="300" x2="480" y2="300"/>
    <line x1="0" y1="400" x2="480" y2="400"/>
    <line x1="0" y1="500" x2="480" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="380" y1="0" x2="380" y2="600"/>
  </g>

  <!-- Body / jacket -->
  <ellipse cx="240" cy="580" rx="180" ry="120" fill="#111122"/>
  <rect x="100" y="380" width="280" height="250" rx="12" fill="#111122"/>

  <!-- Collar / shirt -->
  <path d="M190 380 L240 420 L290 380" fill="#1a1a3a" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Neck -->
  <rect x="215" y="330" width="50" height="60" rx="10" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="240" cy="280" rx="85" ry="95" fill="url(#skin)"/>

  <!-- Hair -->
  <ellipse cx="240" cy="210" rx="85" ry="55" fill="#1a0d00"/>
  <ellipse cx="155" cy="270" rx="18" ry="35" fill="#1a0d00"/>
  <ellipse cx="325" cy="270" rx="18" ry="35" fill="#1a0d00"/>

  <!-- Eyes -->
  <ellipse cx="210" cy="275" rx="12" ry="10" fill="#1a0d00"/>
  <ellipse cx="270" cy="275" rx="12" ry="10" fill="#1a0d00"/>
  <circle cx="213" cy="272" r="3" fill="white"/>
  <circle cx="273" cy="272" r="3" fill="white"/>

  <!-- Nose -->
  <path d="M235 295 Q240 310 245 295" stroke="#8a5a3a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M220 315 Q240 330 260 315" stroke="#8a5a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M198 260 Q210 254 222 260" stroke="#1a0d00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M258 260 Q270 254 282 260" stroke="#1a0d00" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Gold tech circuit detail on jacket -->
  <g opacity="0.35" stroke="url(#gold)" stroke-width="1" fill="none">
    <path d="M130 430 h30 v20 h20"/>
    <path d="M320 430 h-30 v20 h-20"/>
    <circle cx="130" cy="430" r="3" fill="#D4AF37"/>
    <circle cx="350" cy="430" r="3" fill="#D4AF37"/>
  </g>

  <!-- Laptop / tablet glow -->
  <rect x="145" y="450" width="190" height="110" rx="8" fill="#0a0a1a" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="155" y="458" width="170" height="80" rx="4" fill="#0d1a2e"/>
  <!-- Screen content lines -->
  <rect x="163" y="466" width="80" height="4" rx="2" fill="#D4AF37" opacity="0.6"/>
  <rect x="163" y="476" width="120" height="3" rx="2" fill="white" opacity="0.2"/>
  <rect x="163" y="484" width="100" height="3" rx="2" fill="white" opacity="0.15"/>
  <rect x="163" y="492" width="110" height="3" rx="2" fill="white" opacity="0.15"/>
  <!-- Code brackets -->
  <text x="255" y="510" font-family="monospace" font-size="18" fill="#D4AF37" opacity="0.5">&lt;/&gt;</text>

  <!-- Gold accent ring -->
  <circle cx="240" cy="280" r="108" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
</svg>
